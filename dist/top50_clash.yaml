mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
dns:
  enable: true
  ipv6: false
  default-nameserver:
  - 114.114.114.114
  - 8.8.8.8
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  fallback:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
proxies:
- name: NodeHub https://t.me/VIPV2rayNGNP
  type: vless
  server: 172.64.150.28
  port: 2082
  uuid: e5cc16a6-ea42-46b2-82ae-ad2157e1641b
  tls: false
  network: ws
  ws-opts:
    path: /fp
    headers:
      Host: hhlfy.twiladaphne.ndjp.net
- name: NodeHub VLESS-172
  type: vless
  server: 172.67.71.187
  port: 8080
  uuid: e5cc16a6-ea42-46b2-82ae-ad2157e1641b
  tls: false
  network: ws
  sni: hhlfy.twiladaphne.ndjp.net
  servername: hhlfy.twiladaphne.ndjp.net
  ws-opts:
    path: /sg-melbi
    headers:
      Host: hhlfy.twiladaphne.ndjp.net
proxy-groups:
- name: NodeHub - 🚀 节点选择
  type: select
  proxies:
  - NodeHub - ♻️ 自动选择
  - NodeHub - 🔮 故障转移
  - DIRECT
  - NodeHub https://t.me/VIPV2rayNGNP
  - NodeHub VLESS-172
- name: NodeHub - ♻️ 自动选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  proxies: &id001
  - NodeHub https://t.me/VIPV2rayNGNP
  - NodeHub VLESS-172
- name: NodeHub - 🔮 故障转移
  type: fallback
  url: http://www.gstatic.com/generate_204
  interval: 300
  proxies: *id001
- name: NodeHub - 🐌 低速节点
  type: select
  proxies:
  - NodeHub - 🚀 节点选择
  - NodeHub https://t.me/VIPV2rayNGNP
  - NodeHub VLESS-172
rules:
- DOMAIN-SUFFIX,google.com,🚀 节点选择
- DOMAIN-SUFFIX,googleapis.com,🚀 节点选择
- DOMAIN-SUFFIX,github.com,🚀 节点选择
- DOMAIN-SUFFIX,youtube.com,🚀 节点选择
- DOMAIN-KEYWORD,telegram,🚀 节点选择
- DOMAIN-KEYWORD,openai,🚀 节点选择
- GEOIP,LAN,DIRECT
- GEOIP,CN,DIRECT
- MATCH,NodeHub - 🚀 节点选择
