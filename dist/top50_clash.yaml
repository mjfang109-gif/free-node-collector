mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
dns:
  enable: true
  ipv6: false
  default-nameserver:
  - 114.114.114.114
  - 8.8.8.8
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  fallback:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
proxies:
- name: NodeHub configprxy
  type: vless
  server: 172.64.150.28
  port: 2082
  uuid: e5cc16a6-ea42-46b2-82ae-ad2157e1641b
  tls: false
  network: ws
  ws-opts:
    path: /fp
    headers:
      Host: hhlfy.twiladaphne.ndjp.net
- name: NodeHub Tel
  type: vless
  server: 172.64.158.170
  port: 443
  uuid: d342d11e-d224-4463-b982-532309285094
  tls: true
  network: ws
  sni: ccc.010304.xyz
  servername: ccc.010304.xyz
  ws-opts:
    path: /?TELEGRAM--MARAMBASHI--MARAMBASHI--MARAMBASHI--MARAMBASHI?ed=2560
    headers:
      Host: ccc.010304.xyz
- name: NodeHub VLESS-104
  type: vless
  server: 104.18.0.181
  port: 2082
  uuid: e5cc16a6-ea42-46b2-82ae-ad2157e1641b
  tls: false
  network: ws
  ws-opts:
    path: /fp
    headers:
      Host: hhlfy.twiladaphne.ndjp.net
- name: NodeHub VLESS-172
  type: vless
  server: 172.64.229.129
  port: 2052
  uuid: 5744e593-1cc8-48fa-b8ca-57cd494fe35b
  tls: false
  network: ws
  ws-opts:
    path: /rain1226
    headers:
      Host: eu02.123450908.xyz
- name: NodeHub VLESS-104_1
  type: vless
