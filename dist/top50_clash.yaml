mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
dns:
  enable: true
  ipv6: false
  default-nameserver:
  - 114.114.114.114
  - 8.8.8.8
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  fallback:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
proxies:
- name: NodeHub 🇸🇬 SGP
  type: vless
  server: 104.18.35.86
  port: 8080
  uuid: e5cc16a6-ea42-46b2-82ae-ad2157e1641b
  tls: false
  network: ws
  sni: hhlfy.twiladaphne.ndjp.net
  servername: hhlfy.twiladaphne.ndjp.net
  ws-opts:
    path: /sg-melbi
    headers:
      Host: hhlfy.twiladaphne.ndjp.net
- name: NodeHub VLESS-104
  type: vless
  server: 104.19.50.28
  port: 443
  uuid: 2b181a3a-c001-4145-845a-5d43a43837d5
  tls: true
  network: ws
  sni: vpn-1fj.pages.dev
  servername: vpn-1fj.pages.dev
  ws-opts:
    path: /
    headers:
      Host: vpn-1fj.pages.dev
- name: NodeHub VLESS-104_1
  type: vless
  server: 104.18.0.181
  port: 8080
  uuid: e5cc16a6-ea42-46b2-82ae-ad2157e1641b
  tls: false
  network: ws
  ws-opts:
    path: /sg-melbi
    headers:
      Host: hhlfy.twiladaphne.ndjp.net
- name: NodeHub VLESS-104_2
  type: vless
  server: 104.19.33.237
  port: 443
  uuid: 4e4f1f70-5e56-4a76-bb9d-db087f4690c4
  tls: true
  network: ws
  sni: jp3.yohototo.top
  servername: jp3.yohototo.top
  ws-opts:
    path: /tyxyws
    headers:
