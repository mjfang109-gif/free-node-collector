mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
dns:
  enable: true
  ipv6: false
  default-nameserver:
  - 114.114.114.114
  - 8.8.8.8
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  fallback:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
proxies:
- name: NodeHub VLESS-188
  type: vless
  server: 188.164.248.216
  port: 443
  uuid: d342d11e-d224-4463-b982-532309285094
  tls: true
  network: ws
  sni: ccc.010304.xyz
  servername: ccc.010304.xyz
  ws-opts:
    path: /
    headers:
      Host: ccc.010304.xyz
- name: NodeHub VLESS-172
  type: vless
  server: 172.66.0.162
  port: 443
  uuid: d342d11e-d224-4463-b982-532309285094
  tls: true
  network: ws
  sni: ccc.010304.xyz
  servername: ccc.010304.xyz
  ws-opts:
    path: /
    headers:
      Host: ccc.010304.xyz
- name: NodeHub VLESS-172_1
  type: vless
  server: 172.64.152.241
  port: 443
  uuid: d342d11e-d224-4463-b982-532309285094
  tls: true
  network: ws
  sni: ccc.010304.xyz
  servername: ccc.010304.xyz
  ws-opts:
    path: /fp=chrome
    headers:
      Host: ccc.010304.xyz
- name: NodeHub VLESS-170
  type: vless
  server: 170.114.46.6
  port: 8443
  uuid: ba9ba1d3-19c8-4792-9d3f-ddd2cdcc2e65
  tls: true
  network: ws
  sni: primelinelk.me
  servername: primelinelk.me
  ws-opts:
    path: /xprolk-primeline
    headers:
      Host: primelinelk.me
proxy-groups:
- name: NodeHub - 🚀 节点选择
  type: select
  proxies:
  - NodeHub - ♻️ 自动选择
  - NodeHub - 🔮 故障转移
  - DIRECT
  - NodeHub VLESS-188
  - NodeHub VLESS-172
  - NodeHub VLESS-172_1
  - NodeHub VLESS-170
- name: NodeHub - ♻️ 自动选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  proxies: &id001
  - NodeHub VLESS-188
  - NodeHub VLESS-172
  - NodeHub VLESS-172_1
  - NodeHub VLESS-170
- name: NodeHub - 🔮 故障转移
  type: fallback
  url: http://www.gstatic.com/generate_204
  interval: 300
  proxies: *id001
- name: NodeHub - 🐌 低速节点
  type: select
  proxies:
  - NodeHub - 🚀 节点选择
  - NodeHub VLESS-188
  - NodeHub VLESS-172
  - NodeHub VLESS-172_1
  - NodeHub VLESS-170
rules:
- DOMAIN-SUFFIX,google.com,🚀 节点选择
- DOMAIN-SUFFIX,googleapis.com,🚀 节点选择
- DOMAIN-SUFFIX,github.com,🚀 节点选择
- DOMAIN-SUFFIX,youtube.com,🚀 节点选择
- DOMAIN-KEYWORD,telegram,🚀 节点选择
- DOMAIN-KEYWORD,openai,🚀 节点选择
- GEOIP,LAN,DIRECT
- GEOIP,CN,DIRECT
- MATCH,NodeHub - 🚀 节点选择
