- name: NodeHub - ♻️ 自动选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  proxies: &id001
  - NodeHub 🇺🇸 >>::US
  - NodeHub VLESS-172
  - NodeHub 🇺🇸 >>::US_1
  - NodeHub VLESS-170
  - NodeHub VLESS-104
  - NodeHub 🧮12
  - NodeHub Cloudflare
  - NodeHub VLESS-172_1
  - NodeHub VLESS-172_2
  - NodeHub VLESS-172_3
  - NodeHub VLESS-172_4
  - NodeHub 🇩🇪 >>::DE
  - NodeHub VLESS-172_5
  - NodeHub VLESS-172_6
- name: NodeHub - 🔮 故障转移
  type: fallback
  url: http://www.gstatic.com/generate_204
  interval: 300
  proxies: *id001
