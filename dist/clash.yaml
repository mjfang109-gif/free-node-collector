mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
dns:
  enable: true
  ipv6: false
  default-nameserver:
  - 114.114.114.114
  - 8.8.8.8
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  fallback:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
proxies:
- name: NodeHub VLESS-172
  type: vless
  server: 172.67.181.232
  port: 2053
  uuid: e3fb01b6-69b4-41d7-babf-696d992de194
  tls: true
  network: ws
  sni: uwu.blueknightnet.qzz.io
  servername: uwu.blueknightnet.qzz.io
  ws-opts:
    path: /@BlueKnight_net--@BlueKnight_net--@BlueKnight_net--@BlueKnight_net--@BlueKnight_net--@BlueKnight_net
    headers:
      Host: uwu.blueknightnet.qzz.io
- name: NodeHub VLESS-104
  type: vless
  server: 104.16.10.56
  port: 443
  uuid: 4e4f1f70-5e56-4a76-bb9d-db087f4690c4
  tls: true
  network: ws
  sni: jp3.yohototo.top
  servername: jp3.yohototo.top
  ws-opts:
    path: /tyxyws
    headers:
      Host: jp3.yohototo.top
- name: NodeHub VLESS-104_1
  type: vless
  server: 104.16.10.9
  port: 443
  uuid: 4e4f1f70-5e56-4a76-bb9d-db087f4690c4
  tls: true
  network: ws
  sni: jp3.yohototo.top
  servername: jp3.yohototo.top
  ws-opts:
    path: /tyxyws
    headers:
      Host: jp3.yohototo.top
proxy-groups:
- name: NodeHub - 🚀 节点选择
  type: select
  proxies:
  - NodeHub - ♻️ 自动选择
  - NodeHub - 🔮 故障转移
  - DIRECT
  - NodeHub VLESS-172
  - NodeHub VLESS-104
  - NodeHub VLESS-104_1
- name: NodeHub - ♻️ 自动选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  proxies: &id001
  - NodeHub VLESS-172
  - NodeHub VLESS-104
  - NodeHub VLESS-104_1
- name: NodeHub - 🔮 故障转移
  type: fallback
  url: http://www.gstatic.com/generate_204
  interval: 300
  proxies: *id001
- name: NodeHub - 🐌 低速节点
  type: select
  proxies:
  - NodeHub - 🚀 节点选择
  - NodeHub VLESS-172
  - NodeHub VLESS-104
  - NodeHub VLESS-104_1
rules:
- DOMAIN-SUFFIX,google.com,🚀 节点选择
- DOMAIN-SUFFIX,googleapis.com,🚀 节点选择
- DOMAIN-SUFFIX,github.com,🚀 节点选择
- DOMAIN-SUFFIX,youtube.com,🚀 节点选择
- DOMAIN-KEYWORD,telegram,🚀 节点选择
- DOMAIN-KEYWORD,openai,🚀 节点选择
- GEOIP,LAN,DIRECT
- GEOIP,CN,DIRECT
- MATCH,NodeHub - 🚀 节点选择
